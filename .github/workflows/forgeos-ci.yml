name: ForgeOS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Let an active main run finish, while newer pushes replace the single
  # pending main run. This avoids an unbounded queue of stale SHA checks.
  # Pull requests have their own refs, so their runs remain isolated.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "sqlite:///:memory:"
      AI_PROVIDER: mock
      FORGE_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests -vv -o faulthandler_timeout=120

  evidence-triage-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/evidence-triage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/evidence-triage/package-lock.json
      - run: npm ci
      - name: Verify LiveKit Cloud scale Compose requires manual opt-in
        shell: bash
        run: |
          set -euo pipefail
          if docker compose -f ../../docker-compose.livekit-scale.yml config >/dev/null 2>&1; then
            echo "::error::LiveKit Cloud Compose must fail without manual opt-in"
            exit 1
          fi
          LIVEKIT_CLOUD_MANUAL_OPT_IN=ci-contract-check docker compose --profile manual-cloud-opt-in -f ../../docker-compose.livekit-scale.yml config >/dev/null
      - run: npm test
      - run: npm run typecheck
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build

  route-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run smoke

  secret-scan:
    uses: ./.github/workflows/secrets.yml

  repository-guards:
    # Run on direct main pushes too; main is the canonical integration branch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/sync-unknowns-json.mjs --check
      - run: node scripts/check-orphaned-routes.mjs
      - run: node --test scripts/startup-contract.test.mjs

  livekit-local-smoke:
    name: livekit-local-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Start the local SFU and verify nine independent publishers
        shell: bash
        run: |
          set -euo pipefail
          docker compose --profile livekit-local up -d --scale livekit-publisher=9 livekit-publisher

          room_matches() {
            ROOM_JSON="$1" EXPECTED_PARTICIPANTS="$2" python - <<'PY'
          import json
          import os
          import sys

          raw = os.environ.get("ROOM_JSON", "")
          expected = int(os.environ["EXPECTED_PARTICIPANTS"])
          decoder = json.JSONDecoder()
          for offset, char in enumerate(raw):
              if char != "{":
                  continue
              try:
                  document, _ = decoder.raw_decode(raw[offset:])
              except json.JSONDecodeError:
                  continue
              matching_rooms = [
                  room for room in document.get("rooms", [])
                  if room.get("name") == "hami-proving-ground"
                  and room.get("numParticipants") == expected
                  and room.get("numPublishers") == 9
              ]
              if matching_rooms:
                  print(
                      json.dumps(
                          {
                              "rooms": [
                                  {
                                      "name": room.get("name"),
                                      "numParticipants": room.get("numParticipants"),
                                      "numPublishers": room.get("numPublishers"),
                                  }
                                  for room in matching_rooms
                              ]
                          },
                          separators=(",", ":"),
                      )
                  )
                  sys.exit(0)
          sys.exit(1)
          PY
          }

          room_json=""
          for attempt in $(seq 1 30); do
            room_json="$(docker run --rm --network forgeos_default livekit/livekit-cli:v2.19.4 room list --url ws://livekit:7880 --api-key devkey --api-secret secret --json hami-proving-ground 2>/dev/null || true)"
            if room_matches "$room_json" 9; then
              echo "Verified nine publisher participants in one LiveKit room."
              exit 0
            fi
            sleep 2
          done

          docker compose --profile livekit-local ps
          docker compose --profile livekit-local logs --no-color --tail 100 livekit
          docker compose --profile livekit-local logs --no-color --tail 100 livekit-publisher
          echo "::error::Expected nine publishers in hami-proving-ground; room state did not reach 9 participants / 9 publishers."
          exit 1

      - name: Run the 100-subscriber speaker-view load test and verify one shared room
        shell: bash
        run: |
          set -euo pipefail
          resolved_config="$(LIVEKIT_TEST_LAYOUT=speaker LIVEKIT_TEST_SUBSCRIBERS=100 docker compose --profile livekit-local config --format json)"
          RESOLVED_CONFIG="$resolved_config" python - <<'PY'
          import json
          import os

          config = json.loads(os.environ["RESOLVED_CONFIG"])
          service = config["services"]["livekit-load-test"]
          command = service["command"]
          expected = {
              "--room": "hami-proving-ground",
              "--duration": "30s",
              "--subscribers": "100",
              "--num-per-second": "10",
              "--layout": "speaker",
              "--video-resolution": "low",
          }
          if service["image"] != "livekit/livekit-cli:v2.19.4":
              raise SystemExit(f"Unexpected LiveKit CLI image: {service['image']}")
          for option, value in expected.items():
              try:
                  actual = command[command.index(option) + 1]
              except (ValueError, IndexError):
                  raise SystemExit(f"Missing or incomplete LiveKit option: {option}")
              if actual != value:
                  raise SystemExit(f"{option}: expected {value!r}, received {actual!r}")
          print("Verified rendered LiveKit CLI contract: pinned v2.19.4, room hami-proving-ground, 100 subscribers, speaker layout, 30 seconds.")
          PY

          LIVEKIT_TEST_LAYOUT=speaker LIVEKIT_TEST_SUBSCRIBERS=100 docker compose --profile livekit-local run --rm livekit-load-test > "$RUNNER_TEMP/livekit-load-test.log" 2>&1 &
          load_pid=$!
          saw_109_participants=false

          room_matches() {
            ROOM_JSON="$1" EXPECTED_PARTICIPANTS="$2" python - <<'PY'
          import json
          import os
          import sys

          raw = os.environ.get("ROOM_JSON", "")
          expected = int(os.environ["EXPECTED_PARTICIPANTS"])
          decoder = json.JSONDecoder()
          for offset, char in enumerate(raw):
              if char != "{":
                  continue
              try:
                  document, _ = decoder.raw_decode(raw[offset:])
              except json.JSONDecodeError:
                  continue
              matching_rooms = [
                  room for room in document.get("rooms", [])
                  if room.get("name") == "hami-proving-ground"
                  and room.get("numParticipants") == expected
                  and room.get("numPublishers") == 9
              ]
              if matching_rooms:
                  print(
                      json.dumps(
                          {
                              "rooms": [
                                  {
                                      "name": room.get("name"),
                                      "numParticipants": room.get("numParticipants"),
                                      "numPublishers": room.get("numPublishers"),
                                  }
                                  for room in matching_rooms
                              ]
                          },
                          separators=(",", ":"),
                      )
                  )
                  sys.exit(0)
          sys.exit(1)
          PY
          }

          for attempt in $(seq 1 40); do
            room_json="$(docker run --rm --network forgeos_default livekit/livekit-cli:v2.19.4 room list --url ws://livekit:7880 --api-key devkey --api-secret secret --json hami-proving-ground 2>/dev/null || true)"
            if room_matches "$room_json" 109; then
              saw_109_participants=true
              echo "Verified 109 concurrent participants (9 publishers + 100 subscribers)."
              docker stats --no-stream --format 'name={{.Name}} cpu={{.CPUPerc}} mem={{.MemUsage}} net={{.NetIO}}' forgeos-livekit | tee "$RUNNER_TEMP/livekit-sfu-stats.txt"
              break
            fi
            if ! kill -0 "$load_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if ! wait "$load_pid"; then
            cat "$RUNNER_TEMP/livekit-load-test.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/livekit-load-test.log"

          if [ "$saw_109_participants" != "true" ]; then
            docker compose --profile livekit-local ps
            docker compose --profile livekit-local logs --no-color --tail 100 livekit
            docker compose --profile livekit-local logs --no-color --tail 100 livekit-publisher
            echo "::error::The room did not reach 109 concurrent participants (9 publishers + 100 subscribers)."
            exit 1
          fi

      - name: Stop the ephemeral LiveKit test stack
        if: always()
        run: docker compose --profile livekit-local down --remove-orphans
