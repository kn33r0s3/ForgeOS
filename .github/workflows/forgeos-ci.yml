name: ForgeOS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Let an active main run finish, while newer pushes replace the single
  # pending main run. This avoids an unbounded queue of stale SHA checks.
  # Pull requests have their own refs, so their runs remain isolated.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "sqlite:///:memory:"
      AI_PROVIDER: mock
      FORGE_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests -vv -o faulthandler_timeout=120

  evidence-triage-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/evidence-triage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/evidence-triage/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build

  route-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run smoke

  secret-scan:
    uses: ./.github/workflows/secrets.yml

  repository-guards:
    # Run on direct main pushes too; main is the canonical integration branch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/sync-unknowns-json.mjs --check
      - run: node scripts/check-orphaned-routes.mjs
      - run: node --test scripts/startup-contract.test.mjs

  livekit-local-smoke:
    name: livekit-local-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Start the local SFU and verify nine independent publishers
        shell: bash
        run: |
          set -euo pipefail
          docker compose --profile livekit-local up -d --scale livekit-publisher=9 livekit-publisher

          room_json=""
          for attempt in $(seq 1 30); do
            room_json="$(docker run --rm --network forgeos_default livekit/livekit-cli:v2.19.4 room list --url ws://livekit:7880 --api-key devkey --api-secret secret --json hami-proving-ground 2>/dev/null || true)"
            if printf '%s' "$room_json" | jq -e 'any(.rooms[]?; .name == "hami-proving-ground" and .numParticipants == 9 and .numPublishers == 9)' >/dev/null; then
              printf '%s\\n' "$room_json" | jq .
              echo "Verified nine publisher participants in one LiveKit room."
              exit 0
            fi
            sleep 2
          done

          docker compose --profile livekit-local ps
          docker compose --profile livekit-local logs --no-color --tail 100 livekit
          docker compose --profile livekit-local logs --no-color --tail 100 livekit-publisher
          echo "::error::Expected nine publishers in hami-proving-ground; room state did not reach 9 participants / 9 publishers."
          exit 1

      - name: Run the 25-subscriber grid smoke and verify one shared room
        shell: bash
        run: |
          set -euo pipefail
          docker compose --profile livekit-local run --rm livekit-load-test > "$RUNNER_TEMP/livekit-load-test.log" 2>&1 &
          load_pid=$!
          saw_34_participants=false

          for attempt in $(seq 1 20); do
            room_json="$(docker run --rm --network forgeos_default livekit/livekit-cli:v2.19.4 room list --url ws://livekit:7880 --api-key devkey --api-secret secret --json hami-proving-ground 2>/dev/null || true)"
            if printf '%s' "$room_json" | jq -e 'any(.rooms[]?; .name == "hami-proving-ground" and .numParticipants == 34 and .numPublishers == 9)' >/dev/null; then
              printf '%s\\n' "$room_json" | jq .
              saw_34_participants=true
              break
            fi
            if ! kill -0 "$load_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if ! wait "$load_pid"; then
            cat "$RUNNER_TEMP/livekit-load-test.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/livekit-load-test.log"

          if [ "$saw_34_participants" != "true" ]; then
            docker compose --profile livekit-local ps
            docker compose --profile livekit-local logs --no-color --tail 100 livekit
            docker compose --profile livekit-local logs --no-color --tail 100 livekit-publisher
            echo "::error::The room did not reach 34 concurrent participants (9 publishers + 25 subscribers)."
            exit 1
          fi

      - name: Stop the ephemeral LiveKit test stack
        if: always()
        run: docker compose --profile livekit-local down --remove-orphans
