name: ForgeOS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Let an active main run finish, while newer pushes replace the single
  # pending main run. This avoids an unbounded queue of stale SHA checks.
  # Pull requests have their own refs, so their runs remain isolated.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "sqlite:///:memory:"
      AI_PROVIDER: mock
      FORGE_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests -vv -o faulthandler_timeout=120

  hami-media-go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/hami-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/hami-media/go.mod
          cache: true
          cache-dependency-path: services/hami-media/go.sum
      - name: Run native Hami media tests (loopback; no Docker)
        run: go test -count=1 ./...
      - name: Run Go vet
        run: go vet ./...
      - name: Build native Hami media
        run: go build ./...

  evidence-triage-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/evidence-triage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/evidence-triage/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build

  route-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run smoke

  secret-scan:
    uses: ./.github/workflows/secrets.yml

  repository-guards:
    # Run on direct main pushes too; main is the canonical integration branch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/sync-unknowns-json.mjs --check
      - run: node scripts/check-orphaned-routes.mjs
      - run: node --test scripts/startup-contract.test.mjs

  gate-checks:
    # The gates: every outward action through one front door, no bypass.
    # Fails on any red gate, a stale generated report, or a commit message
    # without the [agent][task-id][gates] prefix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Gates — bypass tests + GATES.md freshness
        run: npm run gates
      - name: GATES.md must be committed fresh
        shell: bash
        run: |
          set -euo pipefail
          npm run gates:report
          if ! git diff --quiet --ignore-matching-lines='^Generated ' -- docs/GATES.md; then
            echo "::error::docs/GATES.md is stale — run 'npm run gates:report' and commit it"
            git diff -- docs/GATES.md | head -50
            exit 1
          fi
      - name: Commit messages must carry [agent][task-id][gates]
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          node scripts/check-commit-msg.mjs --range "$RANGE"
