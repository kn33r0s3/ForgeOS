name: Independent deploy verification

# The author of an implementation is not its verifier. This job runs
# outside the builder's control and records: deployed SHA, verification
# time, fetched production content, test counts, test results, and
# pass/fail. Reports without these fields are rejected by the API.
#
# This workflow is append-only by design: it POSTs to /api/opv4/verifications,
# which has no update or delete endpoint.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Run tests
        id: tests
        run: |
          npm test 2>&1 | tee /tmp/test-output.txt
          echo "counts=$(grep -E '^ℹ (tests|pass|fail)' /tmp/test-output.txt | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Get deployed SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Fetch production content
        id: fetch
        run: |
          sleep 90
          CONTENT_HASH=$(curl -s "https://haminp.vercel.app/?v=$(date +%s)" | sha256sum | cut -d' ' -f1)
          echo "hash=$CONTENT_HASH" >> "$GITHUB_OUTPUT"

      - name: Verify deployment
        run: |
          # Wait for Vercel to deploy, then verify the production bundle matches
          sleep 90
          PROD_BUNDLE=$(curl -s "https://haminp.vercel.app/?v=$(date +%s)" | strings | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | head -1)
          LOCAL_BUNDLE=$(npm run build 2>&1 | grep -o 'assets/index-[^ ]*\.js' | head -1)
          echo "Production: $PROD_BUNDLE"
          echo "Local: $LOCAL_BUNDLE"
          if [ "$PROD_BUNDLE" = "$LOCAL_BUNDLE" ]; then
            echo "✓ Deployment verified: production serves the new build"
          else
            echo "✗ Deployment mismatch: production=$PROD_BUNDLE local=$LOCAL_BUNDLE"
            exit 1
          fi
