name: Independent deploy verification

# The author of an implementation is not its verifier. This job runs
# outside the builder's control and records: deployed SHA, verification
# time, fetched production content, test counts, test results, and
# pass/fail. Reports without these fields are rejected by the API.
#
# This workflow is append-only by design: it POSTs to /api/opv4/verifications,
# which has no update or delete endpoint.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Let active verification finish; keep only the latest pending verification
  # for a branch so continuous commits do not create an unbounded queue.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Run tests
        id: tests
        run: |
          # Disable set -e: we must capture the test result, not fail the step.
          set +e
          set -o pipefail
          npm test 2>&1 | tee /tmp/test-output.txt
          TEST_EXIT=${PIPESTATUS[0]}
          echo "exit_code=$TEST_EXIT" >> "$GITHUB_OUTPUT"
          # Extract test counts. The backend rejects empty test_counts with 422,
          # so we must never send an empty string. Try the structured format
          # first, fall back to a simple pass/fail summary.
          COUNTS=$(grep -E '(tests|pass|fail)' /tmp/test-output.txt | tr '\n' ' ' | sed 's/[^a-zA-Z0-9 :]/ /g' | tr -s ' ' || true)
          if [ -z "$COUNTS" ]; then
            if [ "$TEST_EXIT" -eq 0 ]; then
              COUNTS="tests passed (exit 0)"
            else
              COUNTS="tests failed (exit $TEST_EXIT)"
            fi
          fi
          echo "counts=$COUNTS" >> "$GITHUB_OUTPUT"
          if [ "$TEST_EXIT" -eq 0 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi
          # Intentionally no exit: the verification record must capture the actual result.

      - name: Fetch production content
        id: fetch
        run: |
          set -o pipefail
          sleep 90
          CONTENT=$(curl --connect-timeout 10 --max-time 30 -fsSL "https://haminp.vercel.app/?v=$(date +%s)")
          if [ -z "$CONTENT" ]; then
            echo "::error::Production returned an empty response."
            exit 1
          fi
          CONTENT_HASH=$(printf '%s' "$CONTENT" | sha256sum | cut -d' ' -f1)
          echo "hash=$CONTENT_HASH" >> "$GITHUB_OUTPUT"

      - name: Check verifier preconditions
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::error::BACKEND_URL secret is missing or empty. Cannot record verification."
            exit 1
          fi
          if [ -z "$FORGE_API_KEY" ]; then
            echo "::error::FORGE_API_KEY secret is missing or empty. Cannot record verification."
            exit 1
          fi
        env:
          FORGE_API_KEY: ${{ secrets.FORGE_API_KEY }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}

      - name: Wait for exact tested SHA to reach production
        id: sha
        env:
          FORGE_API_KEY: ${{ secrets.FORGE_API_KEY }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          set -uo pipefail
          # Production deployment can legitimately trail a push. Poll for the
          # exact tested commit instead of recording an immediate false failure.
          # The window is bounded; on timeout we record the last real SHA and
          # fail closed in the existing result step.
          MAX_ATTEMPTS=10
          DELAY_SECONDS=15
          LAST_VALID_SHA=""
          DEPLOYMENT_MATCH=false

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            RESPONSE="$(curl --connect-timeout 5 --max-time 10 -fsS \
              "$BACKEND_URL/api/forge-bot/owner/readiness" \
              -H "X-API-Key: $FORGE_API_KEY" 2>/dev/null || true)"
            DEPLOYED_SHA="$(printf '%s' "$RESPONSE" | node -e '
              let body = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", chunk => body += chunk);
              process.stdin.on("end", () => {
                try {
                  const sha = JSON.parse(body).deployed_commit;
                  if (typeof sha === "string" && /^[0-9a-f]{7,40}$/i.test(sha)) {
                    process.stdout.write(sha.toLowerCase());
                  }
                } catch {}
              });
            ')"

            if [ -n "$DEPLOYED_SHA" ]; then
              LAST_VALID_SHA="$DEPLOYED_SHA"
              if [ "$DEPLOYED_SHA" = "$GITHUB_SHA" ]; then
                DEPLOYMENT_MATCH=true
                echo "Production reports the exact tested commit on attempt $attempt."
                break
              fi
              echo "Production still reports a different commit on attempt $attempt."
            else
              echo "::warning::Owner readiness did not return a valid deployed commit on attempt $attempt."
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              sleep "$DELAY_SECONDS"
            fi
          done

          if [ -z "$LAST_VALID_SHA" ]; then
            echo "::error::Could not read a valid deployed commit after $MAX_ATTEMPTS attempts."
            exit 1
          fi
          if [ "$DEPLOYMENT_MATCH" != "true" ]; then
            echo "::warning::Production did not reach the exact tested commit within the bounded wait."
          fi
          echo "sha=$LAST_VALID_SHA" >> "$GITHUB_OUTPUT"
          echo "deployment_match=$DEPLOYMENT_MATCH" >> "$GITHUB_OUTPUT"

      - name: Probe protected owner cycle read
        id: owner_read
        env:
          FORGE_API_KEY: ${{ secrets.FORGE_API_KEY }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          set +e
          HTTP_CODE=$(curl -sS --max-time 15 -o /tmp/owner-cycles.json -w "%{http_code}" \
            "$BACKEND_URL/api/forge/cycles?limit=1" \
            -H "X-API-Key: $FORGE_API_KEY")
          CURL_EXIT=$?
          OWNER_READ_PASSED=false
          RECORD_COUNT=0
          if [ "$CURL_EXIT" -eq 0 ] && [ "$HTTP_CODE" = "200" ]; then
            if RECORD_COUNT=$(node -e '
              try {
                const fs = require("node:fs");
                const value = JSON.parse(fs.readFileSync("/tmp/owner-cycles.json", "utf8"));
                if (!Array.isArray(value)) process.exit(2);
                for (const row of value) {
                  if (!row || !Number.isInteger(row.id) ||
                      !["RUNNING", "COMPLETED", "PARTIAL", "FAILED"].includes(row.status) ||
                      !(row.summary === null || typeof row.summary === "string")) process.exit(3);
                }
                process.stdout.write(String(value.length));
              } catch {
                process.exit(1);
              }
            ' 2>/dev/null); then
              OWNER_READ_PASSED=true
              echo "Protected owner cycle read returned a valid response (${RECORD_COUNT} record(s)); payload suppressed."
            fi
          fi
          if [ "$OWNER_READ_PASSED" != "true" ]; then
            echo "::warning::Protected owner cycle read did not return a valid authenticated DTO (HTTP ${HTTP_CODE:-unavailable}). Payload suppressed."
          fi
          echo "passed=$OWNER_READ_PASSED" >> "$GITHUB_OUTPUT"
      - name: Evaluate verification
        id: result
        env:
          DEPLOYED_SHA: ${{ steps.sha.outputs.sha }}
          TESTS_PASSED: ${{ steps.tests.outputs.passed }}
          OWNER_READ_PASSED: ${{ steps.owner_read.outputs.passed }}
        run: |
          DEPLOYMENT_MATCH="${{ steps.sha.outputs.deployment_match }}"
          if [ "$DEPLOYMENT_MATCH" != "true" ]; then
            echo "::warning::Production SHA does not match the tested push after bounded deployment wait."
          fi

          if [ "$TESTS_PASSED" = "true" ] && [ "$DEPLOYMENT_MATCH" = "true" ] && [ "$OWNER_READ_PASSED" = "true" ]; then
            PASSED=true
          else
            PASSED=false
          fi
          echo "deployment_match=$DEPLOYMENT_MATCH" >> "$GITHUB_OUTPUT"
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"

      - name: Confirm this revision is still current main
        id: freshness
        run: |
          set -euo pipefail
          CURRENT_MAIN_SHA="$(git ls-remote origin refs/heads/main | awk 'NR == 1 { print $1 }')"
          if [ -z "$CURRENT_MAIN_SHA" ]; then
            echo "::error::Could not resolve current main SHA; refusing to record a deployment verdict."
            exit 1
          fi
          if [ "$CURRENT_MAIN_SHA" != "$GITHUB_SHA" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::warning::This verification run was superseded by $CURRENT_MAIN_SHA; no false deployment verdict will be recorded."
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Record verification
        if: steps.freshness.outputs.current == 'true'
        env:
          FORGE_API_KEY: ${{ secrets.FORGE_API_KEY }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          # Capture HTTP status and body separately; never print FORGE_API_KEY
          HTTP_RESPONSE=$(curl --connect-timeout 10 --max-time 30 -s -w "\n%{http_code}" -X POST "$BACKEND_URL/api/opv4/verifications" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $FORGE_API_KEY" \
            -d "{
              \"deployed_sha\": \"${{ steps.sha.outputs.sha }}\",
              \"fetched_content\": \"sha256:${{ steps.fetch.outputs.hash }}\",
              \"test_counts\": \"${{ steps.tests.outputs.counts }}; tested_sha=${{ github.sha }}; deployment_match=${{ steps.result.outputs.deployment_match }}; owner_read_passed=${{ steps.owner_read.outputs.passed }}\",
              \"passed\": ${{ steps.result.outputs.passed }},
              \"source\": \"ci\"
            }")
          HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -n1)
          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
          echo "Verification POST returned HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Verification recorded successfully."
          else
            echo "::error::Verification POST failed with HTTP $HTTP_CODE"
            # Sanitize: strip anything that looks like a key/token before printing
            echo "$HTTP_BODY" | sed -E 's/(api[_-]?key|token|secret)["'\'']?\s*[:=]\s*["'\'']?[^"'\''&,} ]+/\\1=[REDACTED]/gi'
            exit 1
          fi

      - name: Fail workflow when current verification verdict is false
        if: steps.freshness.outputs.current == 'true' && steps.result.outputs.passed != 'true'
        run: |
          echo "::error::Deployment verification was recorded with passed=false. Check the recorded verdict and earlier steps."
          exit 1

      - name: Fail superseded run without recording a verdict
        if: steps.freshness.outputs.current != 'true'
        run: |
          echo "::error::This run tested a superseded main revision; verification was not recorded. The current main SHA needs its own exact-SHA verification."
          exit 1
