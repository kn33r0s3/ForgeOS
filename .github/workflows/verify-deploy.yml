name: Independent deploy verification

# The author of an implementation is not its verifier. This job runs
# outside the builder's control and records: deployed SHA, verification
# time, fetched production content, test counts, test results, and
# pass/fail. Reports without these fields are rejected by the API.
#
# This workflow is append-only by design: it POSTs to /api/opv4/verifications,
# which has no update or delete endpoint.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Run tests
        id: tests
        run: |
          # Disable set -e: we must capture the test result, not fail the step.
          set +e
          set -o pipefail
          npm test 2>&1 | tee /tmp/test-output.txt
          TEST_EXIT=${PIPESTATUS[0]}
          echo "exit_code=$TEST_EXIT" >> "$GITHUB_OUTPUT"
          # Extract test counts. The backend rejects empty test_counts with 422,
          # so we must never send an empty string. Try the structured format
          # first, fall back to a simple pass/fail summary.
          COUNTS=$(grep -E '(tests|pass|fail)' /tmp/test-output.txt | tr '\n' ' ' | sed 's/[^a-zA-Z0-9 :]/ /g' | tr -s ' ' || true)
          if [ -z "$COUNTS" ]; then
            if [ "$TEST_EXIT" -eq 0 ]; then
              COUNTS="tests passed (exit 0)"
            else
              COUNTS="tests failed (exit $TEST_EXIT)"
            fi
          fi
          echo "counts=$COUNTS" >> "$GITHUB_OUTPUT"
          if [ "$TEST_EXIT" -eq 0 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi
          # Intentionally no exit: the verification record must capture the actual result.

      - name: Fetch production content
        id: fetch
        run: |
          set -o pipefail
          sleep 90
          CONTENT=$(curl -fsSL "https://haminp.vercel.app/?v=$(date +%s)")
          if [ -z "$CONTENT" ]; then
            echo "::error::Production returned an empty response."
            exit 1
          fi
          CONTENT_HASH=$(printf '%s' "$CONTENT" | sha256sum | cut -d' ' -f1)
          echo "hash=$CONTENT_HASH" >> "$GITHUB_OUTPUT"

      - name: Check verifier preconditions
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::error::BACKEND_URL secret is missing or empty. Cannot record verification."
            exit 1
          fi
          if [ -z "$FORGE_API_KEY" ]; then
            echo "::error::FORGE_API_KEY secret is missing or empty. Cannot record verification."
            exit 1
          fi
        env:
          FORGE_API_KEY: ${{ secrets.FORGE_API_KEY }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}

      - name: Get deployed SHA
        id: sha
        env:
          FORGE_API_KEY: ${{ secrets.FORGE_API_KEY }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          set -o pipefail
          DEPLOYED_SHA="$(curl -fsS "$BACKEND_URL/api/forge-bot/owner/readiness" \
            -H "X-API-Key: $FORGE_API_KEY" \
            | node -e '
              let body = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", chunk => body += chunk);
              process.stdin.on("end", () => {
                const sha = JSON.parse(body).deployed_commit;
                if (typeof sha !== "string" || !/^[0-9a-f]{7,40}$/i.test(sha)) {
                  console.error("Owner readiness did not provide a valid deployed commit.");
                  process.exitCode = 1;
                  return;
                }
                process.stdout.write(sha);
              });
            ')"
          echo "sha=$DEPLOYED_SHA" >> "$GITHUB_OUTPUT"

      - name: Evaluate verification
        id: result
        env:
          DEPLOYED_SHA: ${{ steps.sha.outputs.sha }}
          TESTS_PASSED: ${{ steps.tests.outputs.passed }}
        run: |
          DEPLOYMENT_MATCH=false
          if [ "$DEPLOYED_SHA" = "$GITHUB_SHA" ]; then
            DEPLOYMENT_MATCH=true
          else
            echo "::warning::Production SHA does not match the tested push."
          fi

          if [ "$TESTS_PASSED" = "true" ] && [ "$DEPLOYMENT_MATCH" = "true" ]; then
            PASSED=true
          else
            PASSED=false
          fi
          echo "deployment_match=$DEPLOYMENT_MATCH" >> "$GITHUB_OUTPUT"
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"

      - name: Record verification
        env:
          FORGE_API_KEY: ${{ secrets.FORGE_API_KEY }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          # Capture HTTP status and body separately; never print FORGE_API_KEY
          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$BACKEND_URL/api/opv4/verifications" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $FORGE_API_KEY" \
            -d "{
              \"deployed_sha\": \"${{ steps.sha.outputs.sha }}\",
              \"fetched_content\": \"sha256:${{ steps.fetch.outputs.hash }}\",
              \"test_counts\": \"${{ steps.tests.outputs.counts }}; tested_sha=${{ github.sha }}; deployment_match=${{ steps.result.outputs.deployment_match }}\",
              \"passed\": ${{ steps.result.outputs.passed }},
              \"source\": \"ci\"
            }")
          HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -n1)
          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
          echo "Verification POST returned HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Verification recorded successfully."
          else
            echo "::error::Verification POST failed with HTTP $HTTP_CODE"
            # Sanitize: strip anything that looks like a key/token before printing
            echo "$HTTP_BODY" | sed -E 's/(api[_-]?key|token|secret)["'\'']?\s*[:=]\s*["'\'']?[^"'\''&,} ]+/\\1=[REDACTED]/gi'
            exit 1
          fi
