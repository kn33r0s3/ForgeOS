name: forgeos-livekit-scale

services:
  livekit-publisher:
    image: livekit/livekit-cli:v2.19.4
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    command:
      - room
      - join
      - --publish-demo
      - ${LIVEKIT_ROOM:-forgeos-scale-test}
    restart: unless-stopped
    stop_grace_period: 20s

  livekit-load-test:
    image: livekit/livekit-cli:v2.19.4
    profiles: [load-test]
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    command:
      - load-test
      - --room
      - ${LIVEKIT_ROOM:-forgeos-scale-test}
      - --duration
      - ${LIVEKIT_TEST_DURATION:-5m}
      - --subscribers
      - ${LIVEKIT_SUBSCRIBERS:-10000}
      - --num-per-second
      - ${LIVEKIT_JOIN_RATE:-100}
      - --layout
      - ${LIVEKIT_LAYOUT:-speaker}
      - --video-resolution
      - ${LIVEKIT_VIDEO_RESOLUTION:-low}
