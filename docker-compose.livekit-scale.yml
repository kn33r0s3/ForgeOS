name: forgeos-livekit-scale

# This is a self-attested manual opt-in, not proof of authorization.
x-hami-cloud-manual-opt-in:
  required: ${LIVEKIT_CLOUD_MANUAL_OPT_IN:?Cloud scale Compose is disabled; only set LIVEKIT_CLOUD_MANUAL_OPT_IN after explicit owner authorization and written LiveKit approval.}

services:
  livekit-publisher:
    image: livekit/livekit-cli:v2.19.4
    profiles: [manual-cloud-opt-in]
    volumes:
      - ${HOME}/.livekit:/root/.livekit:ro
    command:
      - --project
      - hami
      - room
      - join
      - --publish-demo
      - ${LIVEKIT_ROOM:-forgeos-scale-test}
    restart: unless-stopped
    stop_grace_period: 20s

  livekit-load-test:
    image: livekit/livekit-cli:v2.19.4
    profiles: [manual-cloud-opt-in]
    volumes:
      - ${HOME}/.livekit:/root/.livekit:ro
    command:
      - --project
      - hami
      - load-test
      - --room
      - ${LIVEKIT_ROOM:-forgeos-scale-test}
      - --duration
      - ${LIVEKIT_TEST_DURATION:-30s}
      - --subscribers
      - ${LIVEKIT_SUBSCRIBERS:-50}
      - --num-per-second
      - ${LIVEKIT_JOIN_RATE:-10}
      - --layout
      - ${LIVEKIT_LAYOUT:-speaker}
      - --video-resolution
      - ${LIVEKIT_VIDEO_RESOLUTION:-low}
