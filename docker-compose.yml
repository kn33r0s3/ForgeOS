name: forgeos

x-forgeos-environment: &forgeos-environment
  DATABASE_URL: ${DATABASE_URL:-sqlite:////app/storage/forge.db}
  AI_PROVIDER: ${AI_PROVIDER:-hami-model}
  AI_FALLBACK_TO_MOCK: ${AI_FALLBACK_TO_MOCK:-false}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hash}
  HAMI_MODEL_HOST: ${HAMI_MODEL_HOST:-http://host.docker.internal:11436}
  HAMI_CHAT_HOST: ${HAMI_CHAT_HOST:-http://host.docker.internal:11435}
  HAMI_CHAT_KEY: ${HAMI_CHAT_KEY:-}
  EVIDENCE_TRIAGE_URL: ${EVIDENCE_TRIAGE_URL:-}

services:
  evidence-triage:
    # Paid x402 endpoint: opt in only after X402_PAY_TO is configured.
    profiles: ["paid-triage"]
    build:
      context: ./services/evidence-triage
    container_name: forgeos-evidence-triage
    working_dir: /app
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      X402_PAY_TO: ${X402_PAY_TO:-}
      X402_RESOURCE_URL: ${X402_RESOURCE_URL:-}
    ports:
      - "127.0.0.1:8787:8787"
    restart: "no"

  backend:
    build:
      context: ./backend
      args:
        INSTALL_OPTIONAL_AI: ${INSTALL_OPTIONAL_AI:-false}
    container_name: forgeos-backend
    working_dir: /app/backend
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: ./backend/.env
        required: false
    environment: *forgeos-environment
    volumes:
      # This single bind mount is the canonical host volume for forge.db.
      - type: bind
        source: ./storage
        target: /app/storage
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  worker:
    profiles: ["worker"]
    build:
      context: ./backend
      args:
        INSTALL_OPTIONAL_AI: ${INSTALL_OPTIONAL_AI:-false}
    container_name: forgeos-worker
    working_dir: /app/backend
    command: ["python", "-m", "scripts.scheduler", "--every", "1800", "--backup-every", "21600", "--backup-keep", "10"]
    env_file:
      - path: ./backend/.env
        required: false
    environment: *forgeos-environment
    volumes:
      - type: bind
        source: ./storage
        target: /app/storage
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  backend-tests:
    profiles: ["verify"]
    build:
      context: ./backend
      args:
        INSTALL_OPTIONAL_AI: false
    working_dir: /app/backend
    command: ["python", "-m", "pytest", "tests/", "-q"]
    environment:
      DATABASE_URL: "sqlite:///:memory:"
      AI_PROVIDER: mock
      EMBEDDING_PROVIDER: hash

  frontend:
    profiles: ["legacy-frontend"]
    build:
      context: ./docs/archive/legacy-frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: forgeos-frontend
    environment:
      NEXT_PUBLIC_API_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped

  caddy:
    profiles: ["legacy-frontend"]
    image: caddy:2.8-alpine
    container_name: forgeos-caddy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Opt-in local LiveKit smoke environment. All published host ports are loopback-only.
  livekit:
    profiles: ["livekit-local"]
    image: livekit/livekit-server:v1.13.11
    container_name: forgeos-livekit
    command: ["--bind", "0.0.0.0"]
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          udp_port: 7882
        keys:
          devkey: secret
    ports:
      - "127.0.0.1:7880:7880/tcp"
      - "127.0.0.1:7881:7881/tcp"
      - "127.0.0.1:7882:7882/udp"
    restart: unless-stopped
    stop_grace_period: 30s

  # Each scaled replica joins the same room and publishes LiveKit's synthetic demo video.
  # The CLI generates a unique participant identity when --identity is omitted.
  livekit-publisher:
    profiles: ["livekit-local"]
    image: livekit/livekit-cli:v2.19.4
    depends_on:
      - livekit
    command:
      - room
      - join
      - --url
      - ws://livekit:7880
      - --api-key
      - devkey
      - --api-secret
      - secret
      - --publish-demo
      - hami-proving-ground
    restart: unless-stopped

  # One-off local smoke: connect 25 simulated subscribers for 30 seconds.
  livekit-load-test:
    profiles: ["livekit-local"]
    image: livekit/livekit-cli:v2.19.4
    depends_on:
      - livekit
    command:
      - load-test
      - --url
      - ws://livekit:7880
      - --api-key
      - devkey
      - --api-secret
      - secret
      - --room
      - hami-proving-ground
      - --duration
      - "${LIVEKIT_TEST_DURATION:-30s}"
      - --subscribers
      - "${LIVEKIT_TEST_SUBSCRIBERS:-25}"
      - --num-per-second
      - "${LIVEKIT_TEST_JOIN_RATE:-10}"
      - --layout
      - "${LIVEKIT_TEST_LAYOUT:-speaker}"
      - --video-resolution
      - "${LIVEKIT_TEST_VIDEO_RESOLUTION:-low}"
