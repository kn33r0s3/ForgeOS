name: forgeos

x-forgeos-environment: &forgeos-environment
  DATABASE_URL: sqlite:////app/storage/forge.db
  AI_PROVIDER: ${AI_PROVIDER:-mock}
  AI_FALLBACK_TO_MOCK: ${AI_FALLBACK_TO_MOCK:-false}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hash}
  OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
  EVIDENCE_TRIAGE_URL: ${EVIDENCE_TRIAGE_URL:-http://evidence-triage:8787}

services:
  evidence-triage:
    build:
      context: ./services/evidence-triage
    container_name: forgeos-evidence-triage
    working_dir: /app
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      X402_PAY_TO: ${X402_PAY_TO:-}
      X402_RESOURCE_URL: ${X402_RESOURCE_URL:-http://127.0.0.1:8000/evidence-triage/triage}
    expose:
      - "8787"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        INSTALL_OPTIONAL_AI: ${INSTALL_OPTIONAL_AI:-false}
    container_name: forgeos-backend
    working_dir: /app/backend
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: ./backend/.env
        required: false
    environment: *forgeos-environment
    volumes:
      # This single bind mount is the canonical host volume for forge.db.
      - type: bind
        source: ./storage
        target: /app/storage
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 8s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  worker:
    profiles: ["worker"]
    build:
      context: ./backend
      args:
        INSTALL_OPTIONAL_AI: ${INSTALL_OPTIONAL_AI:-false}
    container_name: forgeos-worker
    working_dir: /app/backend
    command: ["python", "-m", "scripts.scheduler", "--every", "1800", "--backup-every", "21600", "--backup-keep", "10"]
    env_file:
      - path: ./backend/.env
        required: false
    environment: *forgeos-environment
    volumes:
      - type: bind
        source: ./storage
        target: /app/storage
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  backend-tests:
    profiles: ["verify"]
    build:
      context: ./backend
      args:
        INSTALL_OPTIONAL_AI: false
    working_dir: /app/backend
    command: ["python", "-m", "pytest", "tests/", "-q"]
    environment:
      DATABASE_URL: "sqlite:///:memory:"
      AI_PROVIDER: mock
      EMBEDDING_PROVIDER: hash

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: forgeos-frontend
    environment:
      NEXT_PUBLIC_API_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    container_name: forgeos-caddy
    ports:
      - "0.0.0.0:3000:3000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped
